<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Fondo base -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Círculo decorativo de fondo -->
  <circle cx="200" cy="110" r="55" fill="rgba(245, 158, 11, 0.04)" stroke="rgba(245, 158, 11, 0.15)" stroke-dasharray="4 4" />

  <!-- Ícono de Cámara / Plato Gastronómico -->
  <g transform="translate(176, 86)">
    <!-- Silueta de plato / campana gourmet con cámara -->
    <path d="M4 14 C4 8.5 8.5 4 14 4 L18 4 L20 1 L28 1 L30 4 L34 4 C39.5 4 44 8.5 44 14 L44 34 C44 39.5 39.5 44 34 44 L14 44 C8.5 44 4 39.5 4 34 Z" fill="none" stroke="url(#amberGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="24" cy="24" r="9" fill="none" stroke="url(#amberGrad)" stroke-width="2.5" />
    <circle cx="24" cy="24" r="4" fill="rgba(245, 158, 11, 0.4)" />
    <circle cx="34" cy="12" r="1.5" fill="#F59E0B" />
  </g>

  <!-- Textos informativos -->
  <text x="200" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1.5" text-transform="uppercase">
    Foto en preparación
  </text>
  <text x="200" y="192" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="400" fill="#64748B" letter-spacing="0.5">
    El Mirador del Cielo • Gastronomía
  </text>
</svg>

